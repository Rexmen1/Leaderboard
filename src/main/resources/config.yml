# Update interval in seconds (how often to refresh leaderboard data)
update-interval: 30

# Storage configuration
storage:
  # Storage type: 'yaml' or 'mysql'
  type: 'yaml'
  
  # MySQL database settings (only used when type is 'mysql')
  mysql:
    host: 'localhost'
    port: 3306
    database: 's12_test_leaderboard'
    username: 'u12_yb6eDv22cW'
    password: 'oomSQGDJQRij0w8i!GX!NI3w'
    # Connection pool settings
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    # Table prefix for leaderboard tables
    table-prefix: 'lb_'

# Debug settings
debug:
  enabled: true
  log-updates: true
  log-texture-cache: false

# Texture Cache Settings
texture-cache:
  enabled: true
  expiry-days: 7 # How many days to keep cached textures
  max-size: 1000 # Maximum number of player textures to cache

# GUI Settings
gui:
  title: "Leaderboards - {type}"
  size: 54 # 6 rows
  navigation:
    next-page:
      slot: 50
      item: ARROW
      name: "§aNext Page"
    previous-page:
      slot: 48
      item: ARROW
      name: "§aPrevious Page"

# Leaderboard Types
leaderboards:
  mobkills:
    title: "Top Mob Kills"
    placeholder: "%statistic_mob_kills%"
    format: "{position}. {player}: {value} kills"
  blocks:
    title: "Top Blocks Mined"
    placeholder: "%statistic_mine_block%"
    format: "{position}. {player}: {value} blocks"



